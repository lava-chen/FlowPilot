name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck and build web app
        run: pnpm build
        env:
          DATABASE_URL: postgresql://flowpilot:flowpilot@localhost:5432/flowpilot
          SESSION_SECRET: ci-only-secret-value-not-used-for-production
          AUTH_PROVIDER: local
          FLOWPILOT_DEMO_MODE: false
          FLOWPILOT_AI_PROVIDER: deterministic
